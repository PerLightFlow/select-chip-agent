services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chipagent}
      POSTGRES_USER: ${POSTGRES_USER:-chipagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - documents:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: [sh, -c, 'python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health/", timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - documents:/app/media
    depends_on:
      backend:
        condition: service_healthy
    command: [python, manage.py, worker]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  database:
  documents:
