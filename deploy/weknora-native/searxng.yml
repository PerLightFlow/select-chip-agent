use_default_settings: true
server:
  limiter: false
  image_proxy: false
  public_instance: false
search:
  formats: [html, json]
  safe_search: 0
outgoing:
  request_timeout: 8.0
  max_request_timeout: 10.0
engines:
  - name: google
    disabled: true
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
