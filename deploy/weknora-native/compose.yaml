name: weknora-native
services:
  frontend:
    image: ${WEKNORA_UI_IMAGE:?Run prepare first}
    environment:
      APP_HOST: app
      APP_PORT: "8080"
      APP_SCHEME: http
      DEFAULT_LOCALE: zh-CN
      MAX_FILE_SIZE_MB: "50"
    ports:
      - '${UI_BIND:-127.0.0.1}:${UI_PORT:-18082}:80'
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
  app:
    image: ${WEKNORA_APP_IMAGE:?Run prepare first}
    env_file: .env
    environment:
      GIN_MODE: release
      LOG_LEVEL: warn
      LLM_DEBUG_LOG: "false"
      WEKNORA_LANGUAGE: zh-CN
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      RETRIEVE_DRIVER: postgres
      STREAM_MANAGER_TYPE: redis
      REDIS_ADDR: redis:6379
      DOCREADER_ADDR: docreader:50051
      STORAGE_TYPE: local
      STORAGE_ALLOW_LIST: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      OLLAMA_BASE_URL: http://embedding:11434
      OLLAMA_OPTIONAL: "false"
      SSRF_WHITELIST: embedding,searxng
      SSRF_WHITELIST_EXTRA: embedding,searxng
      NEO4J_ENABLE: "false"
      WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
      WEKNORA_TENANT_ENABLE_RBAC: "true"
      WEKNORA_TENANT_ENABLE_CROSS_TENANT_ACCESS: "false"
      WEKNORA_TENANT_AUTO_CREATE_API_KEY: "false"
      CONCURRENCY_POOL_SIZE: "4"
      WEKNORA_ASYNQ_CORE_CONCURRENCY: "4"
      WEKNORA_ASYNQ_POSTPROCESS_CONCURRENCY: "2"
      WEKNORA_ASYNQ_ENRICHMENT_CONCURRENCY: "2"
      WEKNORA_WIKI_ASYNQ_CONCURRENCY: "1"
      WEKNORA_MODEL_MAX_CONCURRENCY: "8"
      MAX_FILE_SIZE_MB: "50"
      TZ: Asia/Shanghai
    ports:
      - '127.0.0.1:18083:8080'
    volumes:
      - ${NATIVE_ROOT:?}/data/files:/data/files
      - ${NATIVE_ROOT}/data/docreader:/tmp/docreader:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docreader:
        condition: service_healthy
      embedding:
        condition: service_started
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
  postgres:
    image: ${WEKNORA_DB_IMAGE:?Run prepare first}
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ${NATIVE_ROOT}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    stop_grace_period: 1m
    restart: unless-stopped
  redis:
    image: ${WEKNORA_REDIS_IMAGE:?Run prepare first}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - ${NATIVE_ROOT}/data/redis:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  docreader:
    image: ${WEKNORA_DOCREADER_IMAGE:?Run prepare first}
    environment:
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      LOG_LEVEL: WARNING
      MAX_FILE_SIZE_MB: "50"
      DOCREADER_GRPC_MAX_FILE_SIZE_MB: "50"
      TZ: Asia/Shanghai
    volumes:
      - ${NATIVE_ROOT}/data/docreader:/tmp/docreader
    healthcheck:
      test: [CMD, grpc_health_probe, '-addr=localhost:50051']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped
  embedding:
    image: ${EMBEDDING_IMAGE:?Run prepare first}
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ${NATIVE_ROOT}/data/models:/root/.ollama
    cpus: 4
    mem_limit: 4g
    restart: unless-stopped
  searxng:
    image: ${SEARCH_IMAGE:?Run prepare first}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ${NATIVE_ROOT}/data/searxng:/etc/searxng
    restart: unless-stopped
networks:
  default:
    name: weknora-native
