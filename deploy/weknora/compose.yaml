# WeKnora v0.9.0 knowledge service, independent from the application's PG16 volume.
name: select-chip-weknora
services:
  weknora:
    image: ${WEKNORA_APP_IMAGE:-wechatopenai/weknora-app:v0.9.0}
    env_file: .env
    environment:
      GIN_MODE: release
      LOG_LEVEL: warn
      LLM_DEBUG_LOG: "false"
      DB_DRIVER: postgres
      DB_HOST: knowledge-db
      DB_PORT: "5432"
      RETRIEVE_DRIVER: postgres
      REDIS_ADDR: knowledge-redis:6379
      DOCREADER_ADDR: docreader:50051
      STORAGE_TYPE: local
      STORAGE_ALLOW_LIST: local
      LOCAL_STORAGE_BASE_DIR: /data/files
      OLLAMA_BASE_URL: http://embedding:11434
      OLLAMA_OPTIONAL: "true"
      SSRF_WHITELIST: embedding
      NEO4J_ENABLE: "false"
      WEKNORA_SANDBOX_DOCKER_ENABLED: "false"
      CONCURRENCY_POOL_SIZE: "2"
      MAX_FILE_SIZE_MB: "10"
      TZ: Asia/Shanghai
    volumes:
      - ${WEKNORA_DATA_ROOT:?Set WEKNORA_DATA_ROOT}/files:/data/files
      - ${WEKNORA_DATA_ROOT}/docreader:/tmp/docreader:ro
    ports:
      - '127.0.0.1:${WEKNORA_ADMIN_PORT:-18081}:8080'
    depends_on:
      knowledge-db:
        condition: service_healthy
      knowledge-redis:
        condition: service_healthy
      docreader:
        condition: service_started
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [knowledge]
    restart: unless-stopped
  knowledge-db:
    image: ${WEKNORA_DB_IMAGE:-paradedb/paradedb:v0.25.11-pg17}
    environment:
      POSTGRES_USER: ${DB_USER:-weknora}
      POSTGRES_DB: ${DB_NAME:-weknora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - ${WEKNORA_DATA_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [knowledge]
    restart: unless-stopped
  knowledge-redis:
    image: ${WEKNORA_REDIS_IMAGE:-redis:7.0-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - ${WEKNORA_DATA_ROOT}/redis:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [knowledge]
    restart: unless-stopped
  docreader:
    image: ${WEKNORA_DOCREADER_IMAGE:-wechatopenai/weknora-docreader:v0.9.0}
    environment:
      DOCREADER_IMAGE_OUTPUT_DIR: /tmp/docreader
      LOG_LEVEL: WARNING
      MAX_FILE_SIZE_MB: "10"
    volumes:
      - ${WEKNORA_DATA_ROOT}/docreader:/tmp/docreader
    networks: [knowledge]
    restart: unless-stopped
  embedding:
    image: ${EMBEDDING_IMAGE:-ollama/ollama:0.40.13}
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 10m
    volumes:
      - ${WEKNORA_DATA_ROOT}/models:/root/.ollama
    cpus: 4
    mem_limit: 4g
    networks: [knowledge]
    restart: unless-stopped
networks:
  knowledge:
    name: ${WEKNORA_NETWORK:-select-chip-knowledge}
