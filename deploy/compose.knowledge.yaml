# Apply with the application compose.yaml after the standalone knowledge stack is healthy.
# The application's .env holds WEKNORA_BASE_URL/read/write keys; start in legacy/shadow.
services:
  backend:
    networks: [default, knowledge]
  agent-worker:
    networks: [default, knowledge]
  knowledge-sync:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
    volumes:
      - documents:/app/media
    command: [python, manage.py, knowledge_sync_worker]
    depends_on:
      backend:
        condition: service_healthy
    networks: [default, knowledge]
    restart: unless-stopped
networks:
  knowledge:
    external: true
    name: ${WEKNORA_NETWORK:-select-chip-knowledge}
