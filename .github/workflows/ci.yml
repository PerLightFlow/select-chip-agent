name: Test and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chipagent
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: chipagent
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chipagent"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      POSTGRES_USER: chipagent
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: chipagent
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py test core.tests assistant.tests -v 2
        working-directory: backend
      - name: Probe public official discovery (diagnostic)
        run: python probe_official.py
        working-directory: backend
        timeout-minutes: 4
      - uses: actions/upload-artifact@v4
        with:
          name: official-source-probe
          path: backend/official-source-probe.json
      - run: pip freeze > backend/requirements.resolved.txt
      - uses: actions/upload-artifact@v4
        with:
          name: python-dependencies
          path: backend/requirements.resolved.txt
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/dist
            frontend/package-lock.json
  smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Configure isolated test environment
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-random-value/ci-only-not-for-production/' .env
          sed -i 's/replace-with-a-long-random-password/ci-only-database-password/' .env
      - run: docker compose up --build -d --wait --wait-timeout 180
      - name: Provision test user and fixtures
        run: |
          docker compose exec -T -e DJANGO_SUPERUSER_USERNAME=ui-test -e DJANGO_SUPERUSER_EMAIL=ci@example.invalid -e DJANGO_SUPERUSER_PASSWORD=local-ui-test-only backend python manage.py createsuperuser --noinput
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
        env:
          APP_URL: http://127.0.0.1:8080
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            frontend/playwright-report
            frontend/test-results
      - run: docker compose down -v
        if: always()
